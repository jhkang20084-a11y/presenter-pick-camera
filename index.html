<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표자 추첨 카메라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffc93c;--red:#ff3b5c;--cyan:#22e4ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;user-select:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
#hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* 시작 화면 */
#start{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 45%,#1a1440,#05060f 70%);z-index:20;padding:20px}
#start h1{font-family:'Black Han Sans';font-weight:400;font-size:clamp(40px,7vw,110px);margin:0;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff,#ffd36b);-webkit-background-clip:text;background-clip:text;color:transparent}
#start p{color:#9aa4c8;margin:.6em 0 2em;font-size:clamp(14px,1.4vw,20px)}
#start .btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
#start small{display:block;color:#5f6890;margin-top:2em;font-size:13px}

.go{border:none;cursor:pointer;font-family:'Black Han Sans';font-size:clamp(22px,2.4vw,40px);color:#fff;padding:.55em 1.6em;border-radius:999px;
  background:linear-gradient(135deg,#ff3b8b,#a020ff);box-shadow:0 10px 40px rgba(255,59,139,.5),inset 0 -4px 0 rgba(0,0,0,.2);transition:transform .15s}
.go.alt{background:linear-gradient(135deg,#1fb6ff,#3b5bff);box-shadow:0 10px 40px rgba(31,182,255,.4),inset 0 -4px 0 rgba(0,0,0,.2)}
.go:hover{transform:scale(1.05)}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.6;cursor:wait;transform:none}

/* 하단 조작부 */
#bar{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);display:flex;align-items:center;gap:12px;z-index:10;transition:opacity .4s,transform .4s;max-width:96vw;flex-wrap:wrap;justify-content:center}
#bar.hide{opacity:0;pointer-events:none;transform:translate(-50%,30px)}
#count{min-width:5.5em;text-align:center;padding:.5em 1em;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);font-weight:700;font-size:clamp(14px,1.3vw,20px)}
.ib{width:52px;height:52px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:rgba(0,0,0,.55);color:#fff;font-size:22px;backdrop-filter:blur(8px);transition:.2s;flex:none}
.ib:hover{background:rgba(40,40,60,.8)}
.ib.on{border-color:var(--gold);box-shadow:0 0 18px rgba(255,201,60,.5)}
.ib.off{opacity:.45;filter:grayscale(1)}
#hint{position:fixed;top:3vh;left:50%;transform:translateX(-50%);padding:.45em 1.1em;border-radius:999px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);
  font-size:clamp(12px,1.1vw,17px);color:#cfd6f5;z-index:9;pointer-events:none;white-space:nowrap;transition:opacity .3s;opacity:0}
#hint.on{opacity:1}

/* 자막 */
#cap{position:fixed;left:0;right:0;bottom:12vh;text-align:center;z-index:9;pointer-events:none;font-family:'Black Han Sans';
  font-size:clamp(34px,6vw,110px);text-shadow:0 0 30px rgba(0,0,0,.9),0 4px 0 rgba(0,0,0,.5);opacity:0;transition:opacity .25s}
#cap.on{opacity:1}
#cap.win{color:var(--gold);font-size:clamp(48px,9vw,170px);text-shadow:0 0 40px rgba(255,201,60,.7),0 6px 0 rgba(0,0,0,.5);animation:winpop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes winpop{from{transform:scale(2.2);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
#flash.go{animation:flash .6s ease-out}
@keyframes flash{from{opacity:.85}to{opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:11}
#toast{position:fixed;top:9vh;left:50%;transform:translateX(-50%);padding:.7em 1.3em;border-radius:999px;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);
  font-weight:700;font-size:clamp(14px,1.3vw,20px);z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#drop{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(10,20,60,.75);border:6px dashed var(--cyan);font-family:'Black Han Sans';font-size:clamp(28px,4vw,60px);pointer-events:none}
#drop.on{display:grid}
</style>
</head>
<body>
<video id="hidden" playsinline muted></video>
<canvas id="view"></canvas>
<div id="flash"></div>
<div id="cap"></div>
<div id="hint"></div>
<canvas id="confetti"></canvas>
<input type="file" id="file" accept="image/*" hidden>

<div id="bar" class="hide">
  <div id="count">👀 0명</div>
  <button class="go" id="drawBtn">🎲 발표자 뽑기</button>
  <button class="ib" id="crownBtn" title="당첨자 왕관 켜기/끄기">👑</button>
  <button class="ib" id="camBtn" title="카메라로 추첨">📷</button>
  <button class="ib" id="photoBtn" title="사진 올려서 추첨">🖼</button>
  <button class="ib" id="fs" title="전체화면 (F)">⛶</button>
</div>

<div id="start">
  <div>
    <h1>누가 발표할까?</h1>
    <p>카메라나 사진 속 얼굴 중에서 발표자를 뽑습니다</p>
    <div class="btns">
      <button class="go" id="startBtn">📷 카메라로 시작</button>
      <button class="go alt" id="startPhoto">🖼 사진 올리기</button>
    </div>
    <small>영상과 사진은 이 브라우저 안에서만 처리되며 저장·전송되지 않습니다 · 사진은 화면에 끌어다 놓아도 됩니다</small>
  </div>
</div>
<div id="toast"></div>
<div id="drop">🖼 여기에 사진을 놓으세요</div>

<script type="module">
/* =================== 설정 =================== */
const MP_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
const MIN_CONF = 0.43;     // 얼굴 감지 기준 (낮을수록 가려진 얼굴도 시도)
const GRACE_MS = 2500;     // 얼굴이 잠시 가려져도 유지하는 시간
const VIS_MS = 900;        // 이 시간 안에 감지되면 "지금 화면에 보이는 얼굴"

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const range = (v, size, total) => size >= total ? (total - size) / 2 : clamp(v, 0, total - size);
const randInt = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const video = $('#hidden'), view = $('#view'), vctx = view.getContext('2d');
let crownPref = true; try { crownPref = localStorage.getItem('pp_crown') !== '0'; } catch {}

const S = {
  stream: null, detector: null,
  photo: false, img: null, scanning: false,   // 사진 모드
  tracks: [], nextTid: 1, people: [], nextPid: 1,
  mode: 'idle',            // idle | intro | roulette | win
  focusPid: null, zoomMult: 2.6, camSpeed: .08,
  cam: null, winT0: 0, crown: crownPref,
};
const src = () => S.photo ? S.img : video;
const srcW = () => S.photo ? (S.img?.naturalWidth || 0) : video.videoWidth;
const srcH = () => S.photo ? (S.img?.naturalHeight || 0) : video.videoHeight;
const mirror = () => !S.photo;

/* =================== 사운드 =================== */
let AC, master;
function ac() { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination); } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type = 'sine', v = .3, when = 0, f2 = null) {
  const c = ac(), t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .05);
}
function noise(d, v = .3, when = 0, type = 'bandpass', freq = 1200, q = 1, f2 = null) {
  const c = ac(), t = c.currentTime + when, len = Math.max(1, c.sampleRate * d | 0), buf = c.createBuffer(1, len, c.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(); s.buffer = buf; const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(freq, t); fl.Q.value = q;
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
  const g = c.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(master); s.start(t); s.stop(t + d + .05);
}
const sfx = {
  whoosh() { noise(.45, .4, 0, 'bandpass', 400, 1.2, 3500); },
  tick(p) { tone(500 + p * 700, .07, 'square', .09); noise(.04, .15, 0, 'highpass', 5000); },
  heart(v = .5) { tone(65, .18, 'sine', v, 0, 40); tone(60, .16, 'sine', v * .7, .2, 38); },
  drumroll(d) { for (let t = 0; t < d; t += .05) noise(.06, .08 + .22 * (t / d), t, 'bandpass', 900, .8); },
  riser(d) { tone(120, d, 'sawtooth', .07, 0, 900); noise(d, .12, 0, 'bandpass', 300, 2, 5000); },
  hit() { tone(55, .9, 'sine', .7, 0, 30); noise(.8, .5, 0, 'lowpass', 300); noise(1.5, .3, 0, 'highpass', 6000); },
  fanfare() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { tone(f, .25, 'sawtooth', .12, .15 + i * .11); tone(f / 2, .25, 'triangle', .14, .15 + i * .11); });
    [523.25, 659.25, 783.99, 1046.5].forEach(f => tone(f, 1.4, 'sawtooth', .06, .65)); tone(1046.5, 1.5, 'triangle', .14, .65);
    for (let i = 0; i < 80; i++) noise(.04 + Math.random() * .04, .08 + Math.random() * .1, .7 + Math.random() * 2.3, 'bandpass', 1200 + Math.random() * 1800, 1.5);
  },
  crown(when = 0) { [1568, 2093, 2637, 3136].forEach((f, i) => tone(f, .5, 'sine', .12, when + i * .07)); tone(784, .4, 'triangle', .15, when); },
  click() { tone(900, .06, 'square', .06); },
  err() { tone(160, .3, 'sawtooth', .15); tone(120, .3, 'sawtooth', .12, .12); },
};

/* =================== 얼굴 인식 =================== */
async function loadModel() {
  if (S.detector) return;
  const m = await import(MP_URL);
  const FD = m.FaceDetector || m.default?.FaceDetector, FR = m.FilesetResolver || m.default?.FilesetResolver;
  const fs = await FR.forVisionTasks(MP_URL + '/wasm');
  const make = delegate => FD.createFromOptions(fs, { baseOptions: { modelAssetPath: MODEL_URL, delegate }, runningMode: 'IMAGE', minDetectionConfidence: MIN_CONF, minSuppressionThreshold: .3 });
  try { S.detector = await make('GPU'); } catch { S.detector = await make('CPU'); }
}

const work = document.createElement('canvas'), wctx = work.getContext('2d', { willReadFrequently: true });
const probe = document.createElement('canvas'); probe.width = 32; probe.height = 18;
const pctx = probe.getContext('2d', { willReadFrequently: true });
const HAS_FILTER = 'filter' in wctx, DET = 384;
let gain = 1, frameNo = 0, lastDet = 0, bigTiles = [], smallTiles = [], tileKey = '', bi = 0, si = 0;

// 얼굴 모델은 작은 정사각형 입력을 쓰므로 화면을 정사각형 구역으로 나눠 검사해야 작은 얼굴도 잡힘
function gridTiles(vw, vh, s) {
  const nx = vw > s ? Math.ceil((vw - s) / (s * .65)) + 1 : 1, ny = vh > s ? Math.ceil((vh - s) / (s * .65)) + 1 : 1, out = [];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++)
    out.push([(nx > 1 ? (vw - s) * i / (nx - 1) : (vw - s) / 2) / vw, (ny > 1 ? (vh - s) * j / (ny - 1) : (vh - s) / 2) / vh, s / vw, s / vh]);
  return out;
}
function buildTiles(vw, vh) {
  const key = vw + 'x' + vh; if (key === tileKey) return; tileKey = key;
  const m = Math.min(vw, vh); bigTiles = gridTiles(vw, vh, m); smallTiles = gridTiles(vw, vh, m * .5);
  smallTiles.sort((a, b) => Math.abs(a[1] + a[3] / 2 - .5) - Math.abs(b[1] + b[3] / 2 - .5));
}
function measureLight() {
  pctx.drawImage(src(), 0, 0, 32, 18); const d = pctx.getImageData(0, 0, 32, 18).data; let s = 0;
  for (let i = 0; i < d.length; i += 4) s += d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114;
  const l = s / (d.length / 4); gain = l < 95 ? clamp(115 / Math.max(l, 15), 1, 2) : 1;
}
let lut = null, lutG = 0;
function runOn(sx, sy, sw, sh, boost) {
  const vw = srcW(), vh = srcH();
  if (work.width !== DET) { work.width = DET; work.height = DET; }
  const useB = boost && gain > 1.05;
  wctx.filter = useB && HAS_FILTER ? `brightness(${gain.toFixed(2)}) contrast(${(1 + (gain - 1) * .25).toFixed(2)})` : 'none';
  wctx.fillStyle = '#000'; wctx.fillRect(0, 0, DET, DET);
  wctx.drawImage(src(), sx * vw, sy * vh, sw * vw, sh * vh, 0, 0, DET, DET); wctx.filter = 'none';
  if (useB && !HAS_FILTER) {
    if (lutG !== gain) { lut = new Uint8ClampedArray(256); for (let i = 0; i < 256; i++) lut[i] = 255 * Math.pow(i / 255, 1 / gain); lutG = gain; }
    const img = wctx.getImageData(0, 0, DET, DET), d = img.data; for (let i = 0; i < d.length; i += 4) { d[i] = lut[d[i]]; d[i + 1] = lut[d[i + 1]]; d[i + 2] = lut[d[i + 2]]; } wctx.putImageData(img, 0, 0);
  }
  const squash = Math.abs((sw * vw) / (sh * vh) - 1) > .05;
  return (S.detector.detect(work).detections || []).map(d => {
    const b = d.boundingBox, cx = (sx + ((b.originX + b.width / 2) / DET) * sw) * vw, cy = (sy + ((b.originY + b.height / 2) / DET) * sh) * vh;
    const ph = (b.height / DET) * sh * vh; let pw = (b.width / DET) * sw * vw; if (squash) pw = ph;
    return { x: (cx - pw / 2) / vw, y: (cy - ph / 2) / vh, w: pw / vw, h: ph / vh, s: d.categories?.[0]?.score ?? .5, pr: ph / pw };
  }).filter(d => d.w > .004 && d.w < .9 && d.pr < 2.2 && d.pr > .45);
}
const iou = (a, b) => { const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y), x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h), i = Math.max(0, x2 - x1) * Math.max(0, y2 - y1); return i / (a.w * a.h + b.w * b.h - i + 1e-9); };
const ctr = b => [b.x + b.w / 2, b.y + b.h / 2];
function nms(list) {
  list.sort((a, b) => b.s - a.s); const out = [];
  for (const d of list) {
    const [cx, cy] = ctr(d);
    if (!out.some(o => iou(o, d) > .3 || (cx > o.x && cx < o.x + o.w && cy > o.y && cy < o.y + o.h && Math.max(o.w, d.w) / Math.min(o.w, d.w) < 2.2))) out.push(d);
  }
  return out;
}
function detect(now) {
  if (S.photo || !S.detector || video.readyState < 2 || !video.videoWidth || now - lastDet < 30) return;
  lastDet = now; frameNo++; if (frameNo % 15 === 1) measureLight();
  const vw = video.videoWidth, vh = video.videoHeight; buildTiles(vw, vh);
  const boost = gain > 1.05 && frameNo % 2 === 0; let dets;
  try {
    dets = runOn(0, 0, 1, 1, false);
    if (frameNo % 2) { const b = bigTiles[bi++ % bigTiles.length]; dets = dets.concat(runOn(b[0], b[1], b[2], b[3], boost)); }
    const t = smallTiles[si++ % smallTiles.length]; dets = dets.concat(runOn(t[0], t[1], t[2], t[3], boost));
    // 추적 중인 얼굴 주변 확대 재확인 (추첨 중 비추는 얼굴은 항상 포함)
    const focus = S.tracks.slice().sort((a, b) => a.lastHit - b.lastHit).slice(0, 2);
    const fp = S.focusPid && trackOfP(S.focusPid); if (fp && !focus.includes(fp)) focus[0] = fp;
    for (const tr of focus) {
      const side = clamp(Math.max(tr.box.w * vw, tr.box.h * vh) * 3.2, 120, Math.min(vw, vh));
      if (side >= Math.min(vw, vh) * .95) continue;
      const [cx, cy] = ctr(tr.box);
      dets = dets.concat(runOn(clamp(cx * vw - side / 2, 0, vw - side) / vw, clamp(cy * vh - side / 2, 0, vh - side) / vh, side / vw, side / vh, boost));
    }
  } catch (e) { console.warn(e); return; }
  updateTracks(nms(dets), now);
}

/* =================== 사진 모드: 사진 전체를 여러 크기로 꼼꼼히 검사 =================== */
// 진짜 얼굴은 겹치는 여러 구역·크기에서 반복해서 잡히고, 손·옷 같은 오검출은 한 번만 잡히는 경향 → 투표로 거름
function voteFilter(list) {
  list.sort((a, b) => b.s - a.s); const cl = [];
  for (const d of list) {
    const [cx, cy] = ctr(d);
    const c = cl.find(o => iou(o.box, d) > .3 || (cx > o.box.x && cx < o.box.x + o.box.w && cy > o.box.y && cy < o.box.y + o.box.h && Math.max(o.box.w, d.w) / Math.min(o.box.w, d.w) < 2.2));
    if (c) { c.votes++; } else cl.push({ box: d, votes: 1, s: d.s });
  }
  return cl.filter(c => c.s >= .75 || (c.votes >= 3 && c.s >= .6)).map(c => c.box);
}
async function scanPhoto() {
  S.scanning = true; S.people = []; S.focusPid = null;
  const iw = srcW(), ih = srcH(), m = Math.min(iw, ih);
  measureLight();
  const regions = [[0, 0, 1, 1]];
  for (let s = m, k = 0; s >= 150 && k < 5; s /= 2, k++) regions.push(...gridTiles(iw, ih, s));
  const passes = gain > 1.05 ? [false, true] : [false];
  const total = regions.length * passes.length; let done = 0, dets = [];
  for (const r of regions) for (const b of passes) {
    try { dets.push(...runOn(r[0], r[1], r[2], r[3], b)); } catch (e) { console.warn(e); }
    if (++done % 3 === 0) { S.scanP = done / total; showHint(`🔍 얼굴 찾는 중… ${Math.round(S.scanP * 100)}%`); await sleep(0); }
  }
  dets = voteFilter(dets);
  S.people = dets.map(d => ({ id: S.nextPid++, picked: false, excluded: false, manual: false, trackId: null, lastBox: { x: d.x, y: d.y, w: d.w, h: d.h } }));
  S.scanning = false;
  toast(S.people.length ? `얼굴 ${S.people.length}명을 찾았어요` : '얼굴을 찾지 못했어요. 얼굴을 직접 눌러 추가해 주세요.');
  showHint('얼굴을 누르면 제외 · 빈 곳을 누르면 얼굴 추가');
}

/* =================== 추적 (같은 사람 중복 방지 · 잠깐 가려져도 유지) =================== */
function updateTracks(dets, now) {
  const T = S.tracks, pairs = [];
  T.forEach((t, ti) => dets.forEach((d, di) => {
    const [ax, ay] = ctr(t.box), [bx, by] = ctr(d), size = Math.max(t.box.w, d.w, .05);
    const dist = Math.hypot(ax - bx, (ay - by) * .9) / size, lim = .9 + Math.min(1.6, (now - t.lastHit) / 700);
    const sr = Math.max(t.box.w, d.w) / Math.min(t.box.w, d.w);
    if ((dist < lim || iou(t.box, d) > .2) && sr < 2.4) pairs.push([dist - iou(t.box, d), ti, di]);
  }));
  pairs.sort((a, b) => a[0] - b[0]);
  const ut = new Set(), ud = new Set();
  for (const [, ti, di] of pairs) {

  ac(); const btn = $('#startBtn'); btn.disabled = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    stopCamera(); S.stream = stream; S.photo = false; S.img = null; resetPeople();
    video.srcObject = stream; await video.play();
    toast('얼굴 인식 준비 중…'); await loadModel(); toast('카메라를 바라봐 주세요 👀');
    $('#start').style.display = 'none'; $('#bar').classList.remove('hide'); showHint(''); syncModeButtons();
  } catch (e) {
    console.error(e);
    toast(e.name === 'NotAllowedError' ? '카메라 권한을 허용해 주세요 (주소창 왼쪽 아이콘)' : e.name === 'NotFoundError' ? '연결된 카메라가 없어요. 사진으로 추첨해 보세요.' : '시작할 수 없어요: ' + e.message, 4000);
  } finally { btn.disabled = false; }
}
async function loadPhoto(file) {
  if (!file || !file.type.startsWith('image/')) { toast('사진 파일(jpg, png 등)을 골라 주세요'); return; }
  if (S.mode === 'intro' || S.mode === 'roulette' || S.scanning) return;
  ac();
  const img = new Image(); const url = URL.createObjectURL(file);
  try { await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = url; }); }
  catch { toast('사진을 열 수 없어요'); URL.revokeObjectURL(url); return; }
  if (S.img?.src?.startsWith('blob:')) URL.revokeObjectURL(S.img.src);
  stopCamera(); S.photo = true; S.img = img; resetPeople();
  $('#start').style.display = 'none'; $('#bar').classList.remove('hide'); syncModeButtons();
  showHint('🔍 얼굴 찾는 중…'); S.scanning = true;
  try { await loadModel(); } catch (e) { console.error(e); S.scanning = false; toast('얼굴 인식 모델을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.', 4000); return; }
  await scanPhoto();
}

$('#startBtn').onclick = startCamera;
$('#startPhoto').onclick = () => $('#file').click();
$('#photoBtn').onclick = () => $('#file').click();
$('#camBtn').onclick = () => { if (S.mode === 'intro' || S.mode === 'roulette') return; if (S.photo || !S.stream) startCamera(); };
$('#file').onchange = e => { loadPhoto(e.target.files[0]); e.target.value = ''; };
$('#drawBtn').onclick = () => { if (S.mode === 'win') backToIdle(); draw(); };
$('#crownBtn').onclick = () => { S.crown = !S.crown; try { localStorage.setItem('pp_crown', S.crown ? '1' : '0'); } catch {} syncModeButtons(); toast(S.crown ? '👑 왕관 켜짐 — 당첨자에게 왕관을 씌워요' : '왕관 꺼짐'); };
$('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();

// 사진에서 얼굴 누르기: 제외/복귀, 빈 곳 누르면 직접 추가
view.onclick = e => {
  if (S.mode === 'win') return backToIdle();
  if (!S.photo || S.mode !== 'idle' || S.scanning || !S.cam) return;
  const dpr = Math.min(2, devicePixelRatio || 1), [px, py] = fromScreen(e.clientX * dpr, e.clientY * dpr);
  const iw = srcW(), ih = srcH(), nx = px / iw, ny = py / ih;
  const hit = S.people.find(p => { const b = p.lastBox, m = .15; return nx > b.x - b.w * m && nx < b.x + b.w * (1 + m) && ny > b.y - b.h * m && ny < b.y + b.h * (1 + m); });
  sfx.click();
  if (hit) {
    if (hit.manual) { S.people = S.people.filter(p => p !== hit); toast('추가한 얼굴을 지웠어요'); }
    else { hit.excluded = !hit.excluded; toast(hit.excluded ? '이 얼굴은 추첨에서 빠져요' : '다시 추첨에 넣었어요'); }
    return;
  }
  if (nx < 0 || ny < 0 || nx > 1 || ny > 1) return;
  const sizes = S.people.filter(p => !p.manual).map(p => p.lastBox.h * ih).sort((a, b) => a - b);
  const sz = sizes.length ? sizes[sizes.length >> 1] : Math.min(iw, ih) * .08;
  S.people.push({ id: S.nextPid++, picked: false, excluded: false, manual: true, trackId: null, lastBox: { x: nx - sz / 2 / iw, y: ny - sz / 2 / ih, w: sz / iw, h: sz / ih } });
  toast('얼굴을 직접 추가했어요 (다시 누르면 지워져요)');
};
// 사진 끌어다 놓기
let dragN = 0;
addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { dragN++; $('#drop').classList.add('on'); } });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#drop').classList.remove('on'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#drop').classList.remove('on'); loadPhoto(e.dataTransfer.files[0]); });

addEventListener('keydown', e => {
  if ($('#start').style.display !== 'none') { if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); startCamera(); } return; }
  if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); if (S.mode === 'win') backToIdle(); draw(); }
  else if (e.key === 'f' || e.key === 'F') $('#fs').click();
  else if (e.key === 'Escape') backToIdle();
});
syncModeButtons();

let lastCount = 0;
function loop(now) {
  detect(now); render(now); drawConfetti();
  if (now - lastCount > 300) { lastCount = now; $('#count').textContent = `👀 ${visible(now).length}명`; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
